{% extends "auth/base.html" %}{% block title %}Reset password - DropHub{% endblock %}{% block auth_card %}<div class="auth-card"><div class="auth-form-wrap"><div class="auth-card-heading"><h1>Reset your password</h1><p>Enter your email and we’ll send a secure reset link.</p></div><form method="post" class="auth-form">{% csrf_token %}<div class="auth-field"><label class="auth-label" for="id_email">Email address</label>{{ form.email }}</div><button class="auth-submit" type="submit">Send reset link</button></form><p class="auth-switch"><a href="{% url 'accounts_signin' %}">Back to sign in</a></p></div></div>{% endblock %}
