<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block page_title %}DropHub{% endblock %}</title>
  {% block head_extra %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" /></noscript>
  <link rel="icon" type="image/png" href="/static/Logo.png" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/pages.css" />
</head>
<body class="ip">

<div class="hero-wrapper">
  <div class="hero-stars" aria-hidden="true"></div>

  <header class="navbar">
    <div class="nav-inner">
      <a href="/" class="logo" aria-label="DropHub — Shop Global · We Drop It For You">
        <img src="/static/Logo.png" alt="DropHub" class="logo-img" />
      </a>
      <nav class="nav-links">
        <a href="/shop/">Shop</a>
        <a href="/#safe" class="scroll-link">How It Works</a>
        <a href="/about/">About</a>
        <a href="/blog/">Blog</a>
        <a href="/contact/">Contact</a>
      </nav>
      <div class="nav-actions">
        <div class="cart-wrap">
          <button class="nav-cart" id="cartToggle" aria-label="Open cart" aria-expanded="false" aria-controls="cartDropdown">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F0F0F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4" fill="#0F0F0F" stroke="none"/><circle cx="18" cy="20" r="1.4" fill="#0F0F0F" stroke="none"/><path d="M2.5 3.5h2l2.6 12.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L20.5 7H6"/></svg>
            <span class="cart-badge">0</span>
          </button>
          <div class="cart-dropdown" id="cartDropdown" aria-hidden="true">
            <div class="cart-head">
              <div class="cart-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F64FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h15l-1.2 11a1.5 1.5 0 0 1-1.5 1.3H8.7a1.5 1.5 0 0 1-1.5-1.3L6 8z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
                <span>Your Cart</span>
                <span class="cart-count-pill">0 ITEMS</span>
              </div>
              <button class="cart-close" id="cartClose" aria-label="Close cart">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
              </button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-foot">
              <div class="cart-subtotal"><span>Subtotal</span><strong>$0.00</strong></div>
              <p class="cart-note">You stay locked in until every item arrives.</p>
              <a href="/checkout/" class="btn-primary btn-sm" style="margin-top:12px;display:inline-block;text-align:center;">Checkout</a>
            </div>
          </div>
        </div>
        <button class="nav-burger" id="navBurger" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="mmenu" id="mobileMenu" aria-hidden="true">
      <div class="mmenu-head">
        <a href="/" class="mmenu-logo"><img src="/static/Logo.png" alt="DropHub" /><span>DropHub</span></a>
        <button class="mmenu-close" id="mmenuClose" aria-label="Close menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
        </button>
      </div>
      <div class="mmenu-body">
        <a href="/shop/" class="mmenu-link">Shop</a>
        <a href="/#safe" class="mmenu-link scroll-link">How It Works</a>
        <a href="/about/" class="mmenu-link">About</a>
        <a href="/blog/" class="mmenu-link">Blog</a>
        <a href="/contact/" class="mmenu-link">Contact</a>
        <div class="mmenu-divider"></div>
        <a href="/help/" class="mmenu-link">Help Center</a>
        <a href="/contact/" class="mmenu-link">Contact Us</a>
      </div>
      <div class="mmenu-foot">
        <a href="/signin/" class="mmenu-signin btn-primary btn-sm" style="display:block;text-align:center;padding:12px;">Sign In</a>
      </div>
    </div>
  </header>
  {% block body %}{% endblock %}
</div>
