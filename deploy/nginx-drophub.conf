# Nginx site for DropHub (Django + Gunicorn on 127.0.0.1:8000).
#
# Install (see DEPLOY_VPS.md for the full walkthrough):
#   sudo cp deploy/nginx-drophub.conf /etc/nginx/sites-available/drophub
#   sudo nano /etc/nginx/sites-available/drophub     # set your server_name
#   sudo ln -s /etc/nginx/sites-available/drophub /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add HTTPS with certbot (it rewrites this file for you):
#   sudo certbot --nginx -d drophub.example.com -d www.drophub.example.com

server {
    listen 80;
    listen [::]:80;

    # CHANGE THIS to your real domain.
    server_name drophub.example.com www.drophub.example.com;

    # Product images and seller verification uploads.
    client_max_body_size 25m;

    # Static files collected by `manage.py collectstatic` (run in build.sh).
    # WhiteNoise stays enabled as a fallback, but Nginx serving the directory
    # directly is much faster.
    location /static/ {
        alias /opt/drophub/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Uploaded media. Unlike Render, the VPS disk persists across deploys, so
    # files uploaded to /opt/drophub/media stay put.
    location /media/ {
        alias /opt/drophub/media/;
        access_log off;
        expires 7d;
    }

    # Everything else is proxied to Gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django reads this header (SECURE_PROXY_SSL_HEADER) to detect HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # Compress Django's HTML/JSON responses (static files are already
    # pre-compressed by WhiteNoise).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
