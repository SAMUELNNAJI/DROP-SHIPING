# Render Blueprint for the DropHub Django site.
# https://render.com/docs/blueprint-spec
#
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repo.
# The only value you must supply by hand is DATABASE_URL (the Neon connection
# string); everything else is generated or hard-coded below.
services:
  - type: web
    name: drophub
    runtime: python
    plan: free
    region: frankfurt          # closest Render region to Neon eu-central-1
    branch: main
    buildCommand: "bash build.sh"
    startCommand: "gunicorn dropshipping.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --access-logfile - --error-logfile -"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Match the version pinned in .python-version.
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "false"
      # Render generates a strong SECRET_KEY and keeps it secret.
      - key: SECRET_KEY
        generateValue: true
      # Neon Postgres connection string — REQUIRED in production.
      # Render's disk is ephemeral, so without this the app refuses to boot
      # (see settings.py) instead of writing to SQLite that gets wiped on
      # every sleep/restart/deploy — which is what deleted seller products.
      - key: DATABASE_URL
        sync: false
      # Extra hostnames (custom domains). Render's own hostname is added at
      # runtime, and Render sends a *verified custom domain* in the health
      # check's Host header — so forgetting it here makes the instance look
      # unhealthy (Django answers 400 DisallowedHost).
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      # Neon's pooler (PgBouncer, transaction mode) wants short-lived
      # connections from Django.
      - key: DB_CONN_MAX_AGE
        value: "0"
      # Set these three secret values in Render's Environment tab before the
      # next deploy. The build creates (or repairs) this admin account.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
