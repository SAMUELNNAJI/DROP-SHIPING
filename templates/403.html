﻿{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 — Permission Denied | DropHub</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/static/Logo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: linear-gradient(160deg, #fff7ed 0%, #fef3c7 45%, #fde8c8 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
    }

    /* Blobs */
    .blobs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .32; }
    .blob-1 { width: 480px; height: 480px; background: #fbbf24; top: -140px; right: -100px; animation: blobFloat 9s ease-in-out infinite; }
    .blob-2 { width: 360px; height: 360px; background: #f87171; bottom: -80px; left: -60px; animation: blobFloat 11s ease-in-out infinite reverse; }
    .blob-3 { width: 240px; height: 240px; background: #fb923c; top: 50%; left: 20%; animation: blobFloat 7s ease-in-out infinite 1s; }
    @keyframes blobFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(18px,-28px) scale(1.05); }
      66%      { transform: translate(-14px,18px) scale(.97); }
    }

    .card { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 24px; max-width: 720px; width: 100%; }

    /* Scene */
    .scene { width: min(380px, 82vw); height: min(250px, 58vw); margin-bottom: 24px; position: relative; }

    /* Vault door */
    .vault-wrap {
      position: absolute;
      bottom: 30px; left: 50%; transform: translateX(-50%);
    }
    .vault-door {
      width: 110px; height: 140px;
      background: linear-gradient(160deg, #d97706, #92400e);
      border-radius: 12px 12px 8px 8px;
      border: 4px solid #78350f;
      position: relative;
      box-shadow: 0 12px 36px rgba(120,53,15,.4), inset 0 2px 0 rgba(255,255,255,.15);
      animation: vaultShake 4s ease-in-out infinite;
    }
    @keyframes vaultShake {
      0%,100%          { transform: rotate(0deg); }
      10%, 30%, 50%    { transform: rotate(-1.5deg); }
      20%, 40%, 60%    { transform: rotate(1.5deg); }
      70%              { transform: rotate(0deg); }
    }
    /* Combination wheel */
    .vault-wheel {
      position: absolute;
      top: 22px; left: 50%; transform: translateX(-50%);
      width: 52px; height: 52px;
      background: radial-gradient(circle at 35% 35%, #fbbf24, #d97706);
      border-radius: 50%;
      border: 4px solid #92400e;
      animation: wheelSpin 3s linear infinite;
      box-shadow: 0 4px 12px rgba(0,0,0,.25);
    }
    .vault-wheel::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,.4);
    }
    .vault-wheel::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 46px; height: 4px;
      background: rgba(255,255,255,.5);
      border-radius: 2px;
      transform: translate(-50%, -50%);
    }
    @keyframes wheelSpin { to { transform: translateX(-50%) rotate(360deg); } }

    /* Lock bolt */
    .vault-bolt {
      position: absolute;
      top: 84px; right: -14px;
      width: 20px; height: 12px;
      background: #92400e;
      border-radius: 0 4px 4px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      animation: boltJiggle 4s ease-in-out infinite;
    }
    @keyframes boltJiggle {
      0%,100%   { transform: translateX(0); }
      10%,30%   { transform: translateX(-4px); }
      20%,40%   { transform: translateX(0); }
    }

    /* Keyhole */
    .vault-keyhole {
      position: absolute;
      bottom: 20px; left: 50%; transform: translateX(-50%);
    }
    .vault-keyhole circle { fill: #78350f; }
    .vault-keyhole rect  { fill: #78350f; }

    /* X marks bouncing */
    .x-mark {
      position: absolute;
      font-size: 26px; font-weight: 900; color: #ef4444;
      animation: xBounce 1.8s ease-in-out infinite;
    }
    .x1 { top: 10px; left: 8%; animation-delay: 0s; }
    .x2 { top: 30px; right: 10%; animation-delay: .6s; }
    @keyframes xBounce {
      0%,100% { transform: scale(1) rotate(-5deg); opacity: .9; }
      50%      { transform: scale(1.3) rotate(5deg); opacity: 1; }
    }

    /* Sweat drops from door */
    .sweat {
      position: absolute;
      width: 8px; height: 12px;
      background: #bfdbfe;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      animation: sweatDrop 2s ease-in infinite;
      opacity: 0;
    }
    .sw1 { top: 0; left: 38%; animation-delay: .3s; }
    .sw2 { top: 0; left: 56%; animation-delay: 1.1s; }
    @keyframes sweatDrop {
      0%   { opacity: 0; transform: translateY(0); }
      20%  { opacity: 1; }
      80%  { opacity: .6; }
      100% { opacity: 0; transform: translateY(40px); }
    }

    /* Ground */
    .ground { position: absolute; bottom: 0; left: 0; right: 0; height: 34px; background: linear-gradient(180deg, #fde68a 0%, #fbbf24 100%); border-radius: 17px; }

    /* Text & buttons */
    .err-title { font-size: clamp(26px, 5vw, 38px); font-weight: 800; color: #78350f; letter-spacing: -.03em; margin-bottom: 10px; }
    .err-sub { font-size: 15px; color: #92400e; line-height: 1.65; max-width: 520px; margin-bottom: 28px; }
    .err-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 13px 26px; background: #d97706; color: #fff; font-size: 15px; font-weight: 700; border-radius: 12px; text-decoration: none; box-shadow: 0 8px 20px rgba(217,119,6,.35); transition: background .2s, transform .2s; }
    .btn-primary:hover { background: #b45309; transform: translateY(-2px); }
    .btn-ghost { display: inline-flex; align-items: center; gap: 8px; padding: 13px 26px; border: 1.5px solid #d97706; color: #92400e; font-size: 15px; font-weight: 700; border-radius: 12px; text-decoration: none; background: #fff; transition: background .2s; }
    .btn-ghost:hover { background: #fffbeb; }


    @media (max-width: 480px) {
      .err-actions { flex-direction: column; align-items: stretch; }
      .btn-primary, .btn-ghost { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
<main class="card" role="main" aria-labelledby="err-title">

    <div class="scene" aria-hidden="true">
      <span class="x-mark x1">✕</span>
      <span class="x-mark x2">✕</span>

      <div class="vault-wrap">
        <div class="vault-door">
          <div class="vault-wheel"></div>
          <div class="vault-bolt"></div>
          <svg class="vault-keyhole" width="20" height="28" viewBox="0 0 20 28"><circle cx="10" cy="10" r="6"/><rect x="7" y="14" width="6" height="12" rx="3"/></svg>
          <div class="sweat sw1"></div>
          <div class="sweat sw2"></div>
        </div>
      </div>

      <div class="ground"></div>
    </div>

    <h1 class="err-title" id="err-title">Access denied — 403</h1>
    <p class="err-sub">This vault is locked tight. You don't have permission to be here. Try signing in with the right account.</p>

    <div class="err-actions">
      <a href="/accounts/signin/" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.8" r="3.6"/><path d="M4.8 19.8c.7-3.4 3.7-5.3 7.2-5.3s6.5 1.9 7.2 5.3"/></svg>
        Sign In
      </a>
      <a href="/" class="btn-ghost">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Go Home
      </a>
    </div>

  </main>
</body>
</html>
